name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # 1) Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2) Generate tags (latest + sha)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gragy08/book-exchange-be
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 3) Build & push
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 4) Deploy via SSH (password)
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Stop & remove old container if exists
            if docker ps -a --format '{{.Names}}' | grep -q '^fastapi_server$'; then
              docker rm -f fastapi_server
            fi

            # Pull newest image
            docker pull gragy08/book-exchange-be:latest

            # Run new container
            docker run -d -p 8000:8000 \
            --env-file /root/book-exchange.env \
            --name fastapi_server \
            gragy08/book-exchange-be:latest
